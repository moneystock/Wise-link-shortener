# fly.toml - Configuración para despliegue en Fly.io con volumen persistente SQLite
app = "wise-link-shortener"
primary_region = "qro" # Puedes cambiar la región: ewr, mia, scl, bog, gru, etc.

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "3000"
  DB_DIR = "/data"
  NODE_ENV = "production"
  # Descomentar y actualizar cuando vincules tu subdominio:
  # BASE_URL = "https://go.wisemarketing.agency"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

[[http_service.checks]]
  grace_period = "10s"
  interval = "30s"
  method = "GET"
  path = "/health"
  timeout = "5s"

# Volumen persistente para almacenar database.sqlite
[mounts]
  source = "wise_data"
  destination = "/data"
  initial_size = "1gb"
